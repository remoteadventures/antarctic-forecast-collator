name: Harvest forecasts and observations

on:
  schedule:
    - cron: "20 */3 * * *"   # every 3 hours; AMPS export only runs when a new complete run is available
  workflow_dispatch:          # allow a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: AMPS export (latest complete run, skipped if already exported)
        run: python amps_export.py latest --if-new
        continue-on-error: true

      - name: Archive observations, Open-Meteo runs and AMPS
        run: python harvest.py

      - name: Fill gaps in the AMPS archive (at most 2 runs per cycle)
        run: python amps_backfill.py 2
        continue-on-error: true

      - name: Rebuild AMPS run history for the run-to-run trend
        run: python amps_history.py

      - name: Commit
        run: |
          git config user.name "harvest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data archive
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Harvest $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
